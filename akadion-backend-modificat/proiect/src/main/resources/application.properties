spring.application.name=akadion
server.port=8081

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/akadion
spring.datasource.username=myuser
spring.datasource.password=${DB_PASSWORD:parola123}
spring.docker.compose.enabled=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- OAuth2 Client (BFF pattern) ---

# Client 1: login normal (Authorization Code flow)
spring.security.oauth2.client.registration.keycloak.client-id=backend-login
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_BACKEND_LOGIN_SECRET:ckRYo6MBAP2Ed5LcDRzDTLnYJY085JCK}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:8081/login/oauth2/code/keycloak

# Client 1-dup: login & înregistrare useri (Authorization Code flow cu redirect la register)
spring.security.oauth2.client.registration.keycloak-register.client-id=backend-login
spring.security.oauth2.client.registration.keycloak-register.client-secret=${KEYCLOAK_BACKEND_LOGIN_SECRET:ckRYo6MBAP2Ed5LcDRzDTLnYJY085JCK}
spring.security.oauth2.client.registration.keycloak-register.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak-register.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak-register.provider=keycloak
spring.security.oauth2.client.registration.keycloak-register.redirect-uri=http://localhost:8081/login/oauth2/code/keycloak-register

# Client 2: operatiuni admin (Client Credentials flow — Keycloak Admin REST API)
spring.security.oauth2.client.registration.keycloak-admin.client-id=backend-admin-api
spring.security.oauth2.client.registration.keycloak-admin.client-secret=${KEYCLOAK_ADMIN_API_SECRET:R1THD9jAWSl0lEkvHUlziuWSe0RaukxX}
spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak-admin.provider=keycloak

# Provider Keycloak. Authorization URI is browser-facing; token/JWK/userinfo can be internal in Docker.
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8080/realms/Akadion/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/Akadion/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/Akadion/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_USER_INFO_URI:http://localhost:8080/realms/Akadion/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
# --- Proprietati custom aplicatie ---
app.keycloak.realm=${APP_KEYCLOAK_REALM:Akadion}
app.keycloak.base-url=${APP_KEYCLOAK_BASE_URL:http://localhost:8080}
app.keycloak.browser-base-url=${APP_KEYCLOAK_BROWSER_BASE_URL:http://localhost:8080}
app.frontend.base-url=http://localhost:5173

# --- Logging ---
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.pattern.console=%d{HH:mm:ss} %-5level [%X{requestId:--}] %logger{36} | %msg%n

# --- MinIO & RAG ---
minio.url=http://localhost:9000
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:MinioParola123!}
minio.bucket=course-documents
minio.auto-create-bucket=true
app.rag.base-url=${RAG_BASE_URL:http://localhost:8000}
app.rag.embedder-url=${RAG_EMBEDDER_URL:http://localhost:8001}
app.rag.auth.username=${RAG_SERVICE_USERNAME:akadion-spring-backend}
app.rag.auth.password=${RAG_SERVICE_PASSWORD}

# --- File Upload Limits ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
