services:

  # Vector DB — folosit de embedder pentru stocare/căutare
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    environment:
      QDRANT__LOG_LEVEL: WARN
      TZ: Europe/Bucharest
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network
      
  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile.multistage
    ports:
      - "8001:8001"
    environment:
      # Numele serviciilor țin loc de hostname în rețeaua Docker
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: akadion-minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: MinioParola123!
      MINIO_BUCKET: course-documents
      RAG_SERVICE_USERNAME: ${RAG_SERVICE_USERNAME:-akadion-spring-backend}
      RAG_SERVICE_PASSWORD: ${RAG_SERVICE_PASSWORD:-parola_spring_rag}
      TZ: Europe/Bucharest
      OTEL_SERVICE_NAME: embedder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://akadion-jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      # Modelul BGE-m3 (2.3 GB) descărcat o singură dată, nu la fiecare pornire
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    networks:
      - rag_network
      - akadion_shared

  reranker:
    build:
      context: ./reranker
      dockerfile: Dockerfile.multistage
    ports:
      - "8002:8002"
    # Fără HF_HOME aici: modelul e copt în imagine la /opt/hf,
    # iar o valoare în compose ar suprascrie ENV-ul din Dockerfile.
    environment:
      LOG_FORMAT: json
      SERVICE_NAME: reranker
      TZ: Europe/Bucharest
      OTEL_SERVICE_NAME: reranker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://akadion-jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      RAG_SERVICE_USERNAME: ${RAG_SERVICE_USERNAME:-akadion-spring-backend}
      RAG_SERVICE_PASSWORD: ${RAG_SERVICE_PASSWORD:-parola_spring_rag}
    networks:
      - rag_network
      - akadion_shared

  llm-response:
    build:
      context: ./llm-response
      dockerfile: Dockerfile.multistage
    ports:
      - "8000:8000"
    env_file:
      - ./llm-response/.env
    environment:
      # Suprascriu valorile din .env: acolo e "localhost", aici numele serviciilor
      RERANKER_URL: http://reranker:8002/api/rerank/chunks
      EMBEDDER_URL: http://embedder:8001/api/query/embed
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      USE_QDRANT_MOCK: "false"
      RAG_SERVICE_USERNAME: ${RAG_SERVICE_USERNAME:-akadion-spring-backend}
      RAG_SERVICE_PASSWORD: ${RAG_SERVICE_PASSWORD:-parola_spring_rag}
      LOG_FORMAT: json
      SERVICE_NAME: llm-response
      TZ: Europe/Bucharest
      OTEL_SERVICE_NAME: llm-response
      OTEL_EXPORTER_OTLP_ENDPOINT: http://akadion-jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      - reranker
      - embedder
    networks:
      - rag_network
      - akadion_shared

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16687:16686"
      - "4319:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - rag_network
      - akadion_shared


volumes:
  qdrant_data:
  hf_cache:

networks:
  rag_network:
    driver: bridge
  akadion_shared:
    external: true
