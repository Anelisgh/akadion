# ATENTIE: fisier "solo", doar pentru dezvoltare izolata pe reranker (fara restul stack-ului akadion).
# Porneste pe ACELASI port (8002) ca serviciul "reranker" din rag/compose.yaml.
# NU rula acest fisier in acelasi timp cu rag/compose.yaml sau cu "start-akadion.sh" din radacina -
# se bate pe port. Pentru rularea normala/integrata, foloseste "start-akadion.sh".
services:
  reranker:
    build: .
    container_name: reranker
    ports:
      - "8002:8002"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - LOG_FORMAT=json
      - SERVICE_NAME=reranker

    restart: unless-stopped

volumes:
  hf-cache:
