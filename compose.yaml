services:
  postgres:
    image: 'postgres:16'
    container_name: akadion-postgres
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=akadion'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-parola123}'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: akadion-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioParola123!}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - default
      - akadion_shared

  minio-setup:
    image: minio/mc:latest
    container_name: akadion-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-MinioParola123!}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/course-documents --ignore-existing;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: akadion-keycloak
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/akadion
      - KC_DB_USERNAME=myuser
      - KC_DB_PASSWORD=${DB_PASSWORD:-parola123}
    # --hostname-strict=false permite accesul atat din browser (localhost) cat si intern (keycloak)
    command: start-dev --import-realm --hostname=http://localhost:8080 --hostname-strict=false
    ports:
      - "8080:8080"
    volumes:
      - ./fe-autentificare/keycloak-theme/university-theme:/opt/keycloak/themes/university-theme
      - ./keycloak-import:/opt/keycloak/data/import
    depends_on:
      - postgres

  backend:
    build:
      context: ./akadion-backend-modificat/proiect
      dockerfile: Dockerfile
    container_name: akadion-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - APP_KEYCLOAK_BASE_URL=http://keycloak:8080
      - APP_KEYCLOAK_BROWSER_BASE_URL=http://localhost:8080
      - APP_KEYCLOAK_REALM=akadion
      # issuer-uri pentru containerul backend (acces intern prin hostname-ul Docker)
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/akadion
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/akadion
      - APP_FRONTEND_BASE_URL=http://localhost:5173
      - MINIO_URL=http://minio:9000
      - DB_PASSWORD=${DB_PASSWORD:-parola123}
      - KEYCLOAK_BACKEND_LOGIN_SECRET=${KEYCLOAK_BACKEND_LOGIN_SECRET:-ckRYo6MBAP2Ed5LcDRzDTLnYJY085JCK}
      - KEYCLOAK_ADMIN_API_SECRET=${KEYCLOAK_ADMIN_API_SECRET:-R1THD9jAWSl0lEkvHUlziuWSe0RaukxX}
      - RAG_SERVICE_USERNAME=${RAG_SERVICE_USERNAME:-akadion-spring-backend}
      - RAG_SERVICE_PASSWORD=${RAG_SERVICE_PASSWORD:-parola_spring_rag}
      - RAG_BASE_URL=${RAG_BASE_URL:-http://llm-response:8000}
      - RAG_EMBEDDER_URL=${RAG_EMBEDDER_URL:-http://embedder:8001}
      - TZ=Europe/Bucharest
      # OpenTelemetry - tracing distribuit catre Jaeger (optional, comenteaza pentru dev local fara Jaeger)
      - OTEL_SERVICE_NAME=akadion-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED=true
    networks:
      - default
      - akadion_shared
    depends_on:
      - postgres
      - keycloak
      - minio

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    container_name: akadion-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # UI Jaeger - http://localhost:16686
      - "4318:4318"    # OTLP HTTP endpoint
    networks:
      - default
      - akadion_shared

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: akadion-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  minio_data:
  postgres_data:

networks:
  akadion_shared:
    external: true
